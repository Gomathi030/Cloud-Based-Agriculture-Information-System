<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Crop</title>


<style>

    body {
        font-family: Arial, sans-serif;
        background: #f2f8f2;
        margin: 0;
    }

    nav {
        background: #2e7d32;
        padding: 15px;
    }

    nav h2 {
        display: inline;
        color: white;
        margin-right: 30px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 10px;
    }

    .form-box {
        width: 400px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 6px gray;
    }

    h1 {
        text-align: center;
        color: #2e7d32;
    }

    label {
        display: block;
        margin-top: 15px;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #2e7d32;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background: #1b5e20;
    }

</style>

</head>


<body>


<nav>

    <h2>🌱 AgriInfo</h2>

    <a href="index.html">Home</a>

    <a href="dashboard.html">Dashboard</a>

    <a href="crops.html">Crops</a>

    <a href="weather.html">Weather</a>

    <a href="market.html">Market</a>

    <a href="admin.html">Admin</a>

</nav>


<div class="form-box">


    <h1>➕ Add Crop</h1>


    <form id="cropForm">


        <label>Crop Name</label>

        <input
            type="text"
            id="cropName"
            required
        >


        <label>Crop Type</label>

        <input
            type="text"
            id="cropType"
            required
        >


        <label>Land Area</label>

        <input
            type="text"
            id="landArea"
            placeholder="Example: 3 Acres"
            required
        >


        <label>Location</label>

        <input
            type="text"
            id="location"
            required
        >


        <label>Planting Date</label>

        <input
            type="date"
            id="plantingDate"
            required
        >


        <button type="submit">
            Add Crop
        </button>


    </form>


</div>


<script>


document.getElementById("cropForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // Get logged-in farmer email

        const farmerEmail =
            localStorage.getItem("farmerEmail");


        // Check login

        if (!farmerEmail) {

            alert("Please login first.");

            window.location.href = "login.html";

            return;

        }


        const cropData = {

            farmer_email: farmerEmail,

            crop_name:
                document.getElementById("cropName").value,

            crop_type:
                document.getElementById("cropType").value,

            land_area:
                document.getElementById("landArea").value,

            location:
                document.getElementById("location").value,

            planting_date:
                document.getElementById("plantingDate").value

        };


        try {


            const response = await fetch(
                "/api/add-crop",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(cropData)
                }
            );


            const result =
                await response.text();


            alert(result);


            if (response.ok) {

                window.location.href =
                    "crops.html";

            }


        }

        catch (error) {

            alert(
                "Unable to connect to Flask server."
            );

            console.error(error);

        }

    }

);

</script>


</body>

</html>
